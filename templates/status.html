<!DOCTYPE html>
<html>
<head>
    <title>Installation Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Installation Results</h1>
        <h2>Tool Installation Status</h2>
        <ul>
            {% for tool, result in results.items() %}
            <li><strong>{{ tool.capitalize() }}:</strong> {{ result }}</li>
            {% endfor %}
        </ul>
        <h2>Logs</h2>
        <pre>{{ logs|join('\n') }}</pre>
        {% if gemini_analysis %}
        <h2>AI Summary</h2>
        <div class="gemini-response">{{ gemini_analysis }}</div>
        {% endif %}
        <a href="{{ url_for('main.index') }}">Back to Tools</a>
    </div>
</body>
</html>
